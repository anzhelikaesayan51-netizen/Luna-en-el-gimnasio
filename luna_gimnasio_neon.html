<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna y el gimnasio Neón</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a24;--panel:#1b0a3a;--pink:#ff2bb5;--cyan:#27d6ff;--gold:#f6a431;--ok:#4dffa0;--bad:#ff5c6c;--txt:#f3e9ff}
@media(prefers-color-scheme:light){:root{--bg:#060a24}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 100%,#2a0f55 0%,var(--bg) 65%);color:var(--txt);font-family:'Chakra Petch',system-ui,sans-serif;font-size:18px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 38px,rgba(120,170,255,.16) 38px 40px);background-size:120px 120px;animation:rain .7s linear infinite}
@keyframes rain{to{background-position:-30px 120px}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
#app{position:relative;max-width:860px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);padding:6px 2px}
.btn{font-family:inherit;font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(#3a1a7a,#220e50);border:3px solid var(--pink);padding:10px 22px;cursor:pointer;box-shadow:0 0 14px rgba(255,43,181,.55);border-radius:4px}
.btn:hover,.btn:focus-visible{background:#4a2398;outline:3px solid var(--cyan);outline-offset:2px}
h1,h2{font-family:'Press Start 2P',monospace;color:var(--gold);line-height:1.5;text-shadow:3px 3px 0 #7a2a00}
h1{font-size:clamp(24px,6vw,44px);text-align:center;margin:12vh 0 24px}
h2{font-size:clamp(14px,3.2vw,20px)}
.center{text-align:center}
.scene{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.avatar{align-self:flex-end;font-size:96px;line-height:1;filter:drop-shadow(0 0 12px var(--cyan));margin-right:8%}
.box{background:rgba(27,10,58,.92);border:3px solid var(--pink);box-shadow:0 0 18px rgba(255,43,181,.5);padding:18px 20px;border-radius:4px}
.who{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--cyan);margin-bottom:10px}
.txt{line-height:1.5;min-height:3.2em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;line-height:2}
.paper{background:#f7ecd0;color:#2a1a10;border:3px solid #7a5a30;padding:16px 20px;border-radius:2px}
.paper h2{color:#8a2a00;text-shadow:none;margin-top:0}
select,input{font-family:inherit;font-size:1rem;padding:5px 8px;border:2px solid #7a5a30;background:#fffaf0;color:#2a1a10;border-radius:3px}
select.ok{border-color:#0a9a55;background:#d9ffe9}
select.bad{border-color:var(--bad);background:#ffe0e4}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;font-family:inherit;font-size:1rem;color:var(--txt);background:#2b1260;border:2px solid var(--cyan);padding:11px 14px;cursor:pointer;border-radius:4px}
.opt:hover,.opt:focus-visible{background:#3d1d85;outline:2px solid var(--gold)}
.opt.ok{border-color:var(--ok);background:#0e4a33}
.opt.bad{border-color:var(--bad);background:#5a1420}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:600}
.msg.ok{color:#0a7a45}.msg.bad{color:#b3001b}
.box .msg.ok{color:var(--ok)}.box .msg.bad{color:var(--bad)}
.key{font-family:'Press Start 2P',monospace;color:var(--gold);font-size:13px;margin-top:12px}
.hint{font-size:.9rem;opacity:.85;margin-top:8px}
#code{width:130px;text-align:center;font-family:'Press Start 2P',monospace;font-size:20px;letter-spacing:6px}
#hud{flex-wrap:wrap;gap:6px}
.chip{background:#3a1a7a;color:#fff;padding:4px 10px;border-radius:3px;border:2px solid var(--pink);font-family:inherit;font-size:1rem}
button.chip{cursor:pointer}button.chip:hover{background:#5a2aa8}
.spk{font-size:1.1rem;background:var(--cyan);color:#06102a;border:3px solid #fff;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:600;font-family:inherit;margin-right:10px}
.go{font-family:'Press Start 2P',monospace;color:var(--bad);font-size:22px;text-align:center;margin:10vh 0 20px}
input.ok{border-color:#0a9a55;background:#d9ffe9}input.bad{border-color:var(--bad);background:#ffe0e4}
</style>
</head>
<body>
<div id="app"><div id="hud"><span>LUNA Y EL GIMNASIO NEÓN</span><span id="keys">🔑 _ _ _</span></div><div id="stage"></div></div>
<script>
const KEYS=['3','7','1'];
let i=0,got=[],lives=3,stars=0,xp=0,AC;
function sfx(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='square';o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(ok?523:180,t);if(ok)o.frequency.setValueAtTime(784,t+.1);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function speak(t){if(!('speechSynthesis' in window)){alert('Tu navegador no tiene voz. Texto del audio: '+t);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices(),f=v.find(x=>x.lang.replace('_','-')==='es-AR')||v.find(x=>/^es[-_](419|MX|US|UY|CL)/.test(x.lang))||v.find(x=>x.lang.startsWith('es'));if(f){u.voice=f;u.lang=f.lang}else u.lang='es-AR';u.rate=.85;speechSynthesis.speak(u)}
function wrong(){sfx(0);lives--;hud();if(lives<=0){$('#stage').innerHTML='<div class="go">GAME OVER</div><p class="center">Te quedaste sin vidas. ¡Luna no se rinde!</p><p class="center"><button class="btn" id="rt">Reintentar el desafío</button></p>';$('#rt').onclick=()=>{lives=3;render()};return true}return false}
function reward(s){sfx(1);xp+=100;if(s.key!==undefined){give(s.key);return '🔑 Encontraste el número '+KEYS[s.key]+' · +100 XP'}stars++;hud();return '⭐ ¡Desafío superado! +100 XP'}
const $=s=>document.querySelector(s);
const OPT_DOLER=['me duele','te duele','le duele','nos duele','les duele','me duelen','te duelen','le duelen','nos duelen','les duelen'];

const S=[
{t:'title'},
{t:'say',who:'Narrador',av:'🌧️',txt:'Es de noche y llueve fuerte. Luna está en su casa, tomando un té caliente. De pronto, suena el celular: llegó un mensaje de un número desconocido.'},
{t:'say',who:'Mensaje',av:'📱',txt:'«Luna, vení al gimnasio Neón. Tomi desapareció. Dejó la llave del vestuario escondida en tres desafíos. Apurate».'},
{t:'say',who:'Luna',av:'🧑‍🎤',txt:'¿Tomi? ¡Pero si él nunca falta al gimnasio! Che, algo raro pasa. Voy ya.'},
{t:'say',who:'Narrador',av:'🏋️',txt:'Gimnasio Neón, 23:00. Está todo oscuro. Las máquinas tienen carteles, pero alguien los cambió de lugar.'},
{t:'match',title:'Desafío 1: las máquinas',intro:'Elegí qué parte del cuerpo se entrena en cada máquina.',
 items:[['Prensa de piernas','las piernas'],['Remo con polea','la espalda'],['Press de pecho','el pecho'],['Curl de bíceps','los brazos'],['Banco de abdominales','el abdomen'],['Press de hombros','los hombros']],
 opts:['las piernas','la espalda','el pecho','los brazos','el abdomen','los hombros'],key:0},
{t:'say',who:'Luna',av:'🧑‍🎤',txt:'¡Se abrió el primer candado! Hay una nota pegada en la pared: «Anotá lo que nos duele después de entrenar. Acá tengo frases rotas…»'},
{t:'fill',title:'Desafío 2: ¿qué les duele?',intro:'Completá con la forma correcta de doler. Pensá: ¿quién siente el dolor? ¿Qué duele: una parte o varias?',
 items:[['A mí',' la cabeza.','me duele'],['¿A vos',' las rodillas?','te duelen'],['A Luna',' la espalda.','le duele'],['A mi hermano y a mí',' los brazos.','nos duelen'],['A los chicos',' el estómago.','les duele']],key:1},
{t:'say',who:'Luna',av:'🧑‍🎤',txt:'¡Segundo candado abierto! Al fondo, una puerta dice «Consultorio». Adentro hay una luz prendida: la doctora Ríos me está esperando.'},
{t:'quiz',title:'Desafío 3: en el consultorio',av:'👩‍⚕️',who:'Doctora Ríos',
 qs:[
 ['Buen día, Luna. ¿Qué te pasa?',['Me duele la espalda.','Mi duele la espalda.','Le duele la espalda.'],0,'Hablás de vos: «me duele».'],
 ['¿Te duelen también las piernas?',['No, no me duele las piernas.','No, no me duelen las piernas.','No, no te duelen las piernas.'],1,'«Las piernas» es plural: «duelen».'],
 ['¿Desde cuándo te duele?',['Desde ayer. Hice mucho peso en el remo.','Desde ayer. Me dolo mucho.','Desde ayer. Yo duelo mucho.'],0,'El verbo doler lleva «me / te / le…» y la cosa que duele es el sujeto.'],
 ['Tenés que descansar la espalda. ¿Qué máquina podés usar hoy?',['El remo, porque entrena la espalda.','La cinta de correr, porque entrena las piernas.','Ninguna: me quedo a dormir en el gimnasio.'],1,'Con la espalda lastimada, entrená las piernas.']
 ],key:2},
{t:'say',who:'Doctora Ríos',av:'👩‍⚕️',txt:'Muy bien. Tomi está en el vestuario, pero la puerta tiene un candado con código. Usá los tres números que encontraste, en orden.'},
{t:'code'},
{t:'say',who:'Narrador',av:'🔓',txt:'¡Clic! El candado se abrió. Tomi está sentado en el vestuario con una bolsa de hielo en la espalda. «Te dejé un audio, Luna. Escuchalo». CAPÍTULO 2: ¿qué pasó ayer?'},
{t:'quiz',title:'Desafío 4: el audio de Tomi',av:'📱',who:'Audio de Tomi',
 qs:[
 ['¿A qué hora llegó Tomi al gimnasio?',['A las seis de la tarde.','A las ocho de la noche.','A las diez de la noche.'],0,'Dijo «llegué a las seis».','Hola Luna, soy Tomi. Ayer llegué al gimnasio a las seis de la tarde. Primero corrí veinte minutos en la cinta y después hice pesas con Fede.'],
 ['¿Qué hizo Tomi primero?',['Corrió en la cinta.','Hizo pesas.','Fue al médico.'],0,'Primero corrió («corrí») y después hizo pesas («hice»).','Primero corrí veinte minutos en la cinta y después hice pesas con Fede.'],
 ['¿Qué sintió Tomi en el remo?',['Un dolor fuerte en la espalda.','Un dolor en las piernas.','Nada, se sintió bien.'],0,'«Sentí» es el pretérito de «yo».','Después levanté mucho peso en el remo. Sentí un dolor fuerte en la espalda, pero seguí entrenando. ¡Qué tonto!'],
 ['¿Qué hizo Tomi anoche?',['No durmió y le mandó un mensaje a Luna.','Durmió ocho horas.','Fue a la playa.'],0,'«No dormí» y «te mandé» son pretéritos de «yo».','Anoche no dormí nada. Te mandé un mensaje y vine otra vez al gimnasio.']
 ]},
{t:'say',who:'Tomi',av:'🧑‍🦱',txt:'Ayer fui al gimnasio y hice todo mal. ¿Vos sabés cómo se habla del pasado? Probá con estos verbos. Ojo: el pretérito de «ir» y «ser» es igual.'},
{t:'fill',text:true,title:'Desafío 5: ¿qué pasó?',intro:'Escribí el verbo en pretérito, para hablar de ayer. Ojo con el voseo: «vos fuiste».',
 items:[['Ayer yo',' (hacer) mucho peso.','hice'],['Vos',' (ir) solo al gimnasio, ¿no?','fuiste'],['Tomi',' (lastimarse) la espalda.','se lastimó'],['Fede y yo',' (entrenar) dos horas.','entrenamos'],['Los chicos',' (tener) miedo.','tuvieron'],['¿Qué',' (pasar), Tomi?','pasó']]},
{t:'say',who:'Narrador',av:'🏥',txt:'Afuera, en la sala de espera del consultorio, hay otros pacientes. La doctora Ríos tiene un grabador con sus mensajes. Escuchalos con atención.'},
{t:'quiz',title:'Desafío 6: escuchá a los pacientes',av:'🧑‍🤕',who:'Sala de espera',
 qs:[
 ['¿Qué le duele a este paciente?',['El cuello y los hombros.','La cabeza y los pies.','Las rodillas y la espalda.'],0,'«Me duele el cuello» y «me duelen los hombros».','Hola, doctora. Me duele mucho el cuello. Me duelen también los hombros. Ayer pasé ocho horas frente a la computadora.'],
 ['¿Qué le pasa al hijo de la señora?',['Le duele la panza.','Le duelen los oídos.','Le duele la garganta.'],0,'«Panza» es una palabra muy usada en Argentina para el estómago o el abdomen.','A mi hijo le duele la panza desde anoche. Comió muchas facturas en la merienda y después no quiso cenar.'],
 ['¿Por qué tienen dolor estas dos personas?',['Caminaron mucho.','Corrieron una maratón.','Se cayeron de la bici.'],0,'«Nos duelen las piernas» porque «caminamos seis horas».','Doctora, nos duelen las piernas a mi esposa y a mí. Ayer subimos el cerro y caminamos seis horas.']
 ]},
{t:'say',who:'Doctora Ríos',av:'👩‍⚕️',txt:'Bueno, Tomi, ahora te reviso a vos. Contestame con sinceridad: necesito toda la información para ayudarte.'},
{t:'quiz',title:'Desafío 7: la consulta completa',av:'👩‍⚕️',who:'Doctora Ríos',
 qs:[
 ['A ver, Tomi. ¿Qué hiciste ayer en el gimnasio?',['Hice pesas y corrí.','Hizo pesas y corrí.','Hice pesas y corrió.'],0,'Tomi habla de sí mismo: «hice» y «corrí».'],
 ['¿Cuándo empezó el dolor?',['Empezó después del remo.','Empecé después del remo.','Empezaste después del remo.'],0,'El sujeto es «el dolor»: «empezó».'],
 ['¿Tomaste algún remedio?',['Sí, tomé un ibuprofeno.','Sí, tomó un ibuprofeno.','Sí, tomí un ibuprofeno.'],0,'Yo tomé (con tilde).'],
 ['¿Te duele cuando respirás?',['No, solo me duele cuando me agacho.','No, solo te duele cuando me agacho.','No, solo me duelen cuando me agacho.'],0,'«Me duele» + cuando + verbo.'],
 ['Tomate una semana de descanso. ¿Qué entendés?',['Tengo que descansar una semana.','Tengo que correr una semana.','Tengo que ir a la doctora ayer.'],0,'Tengo que + infinitivo expresa obligación.']
 ]},
{t:'say',who:'Doctora Ríos',av:'👩‍⚕️',txt:'Última prueba. Para el informe médico tengo que ordenar lo que pasó. Ayudame a armar las frases.'},
{t:'order',title:'Desafío 8: el informe',intro:'Tocá las palabras en el orden correcto.',
 items:[['Ayer','fui','al','gimnasio','con','Tomi'],['Nosotros','hicimos','pesas','dos','horas'],['Después','le','dolió','la','espalda'],['La','doctora','me','dio','un','remedio']]},
{t:'end'}
];

function hud(){$('#keys').textContent='❤️'.repeat(Math.max(lives,0))+'🖤'.repeat(3-Math.max(lives,0))+'  ⭐'+stars+'  🔑 '+[0,1,2].map(n=>got[n]||'_').join(' ')+'  XP '+xp}
function next(){i++;render()}
function give(k){got[k]=KEYS[k];hud()}

function render(){
 const s=S[i],st=$('#stage');hud();
 if(s.t==='title'){
  st.innerHTML='<h1>LA HISTORIA DE LUNA</h1><p class="center" style="font-size:1.1rem">Una aventura para practicar <b>doler</b>, partes del cuerpo, el gimnasio y la consulta médica.</p><p class="center"><button class="btn" id="go">Empezar</button></p>';
  $('#go').onclick=next;
 }else if(s.t==='say'){
  st.innerHTML=`<div class="scene"><div class="avatar" aria-hidden="true">${s.av}</div><div class="box"><div class="who">${s.who}</div><div class="txt" id="tx"></div><p style="text-align:right;margin:8px 0 0"><button class="btn" id="nx">Seguir ›</button></p></div></div>`;
  const tx=$('#tx');let n=0;const iv=setInterval(()=>{tx.textContent=s.txt.slice(0,++n);if(n>=s.txt.length)clearInterval(iv)},18);
  $('#nx').onclick=()=>{clearInterval(iv);next()};$('#nx').focus();
 }else if(s.t==='match'||s.t==='fill'){
  const opts=s.t==='match'?s.opts:OPT_DOLER;
  const sel=s.text?'<input size="12" autocomplete="off">':`<select><option value="">—</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
  const rows=s.items.map(it=>s.t==='match'?`<div class="row"><b>${it[0]}</b> → ${sel}</div>`:`<div class="row">${it[0]} ${sel} ${it[1]}</div>`).join('');
  st.innerHTML=`<div class="scene"><div class="paper"><h2>${s.title}</h2><p>${s.intro}</p>${rows}<p class="msg" id="m"></p><button class="btn" id="ck">Comprobar</button></div></div>`;
  $('#ck').onclick=()=>{
   const sels=[...document.querySelectorAll('select,.paper input')];let bad=0;
   const nz=x=>x.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
   sels.forEach((e,n)=>{const a=s.items[n][s.t==='match'?1:2];const ok=s.text?nz(e.value)===nz(a):e.value===a;e.className=ok?'ok':'bad';if(!ok)bad++});
   const m=$('#m');
   if(bad){if(wrong())return;m.className='msg bad';m.textContent=bad+(bad>1?' respuestas no son correctas':' respuesta no es correcta')+'. Revisá las que están en rojo.'}
   else{m.className='msg ok';m.textContent='¡Perfecto!';$('#ck').outerHTML='<div class="key">'+reward(s)+'</div><p><button class="btn" id="nx">Seguir ›</button></p>';$('#nx').onclick=next}
  };
 }else if(s.t==='quiz'){
  let q=0;
  const show=()=>{
   const d=s.qs[q];
   st.innerHTML=`<div class="scene"><div class="avatar" aria-hidden="true">${s.av}</div><div class="box"><div class="who">${s.who} · ${s.title} (${q+1}/${s.qs.length})</div><div class="txt">${d[4]?'<button class="spk" id="sp">🔊 Escuchar</button>':''}${d[0]}</div><div class="opts">${d[1].map((o,n)=>`<button class="opt" data-n="${n}">${o}</button>`).join('')}</div><p class="msg" id="m"></p></div></div>`;
   if(d[4])$('#sp').onclick=()=>speak(d[4]);
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.n===d[2],m=$('#m');
    if(ok){b.classList.add('ok');m.className='msg ok';m.textContent='¡Muy bien! '+d[3];
     document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
     setTimeout(()=>{q++;if(q<s.qs.length)show();else{const r=reward(s);$('#m').insertAdjacentHTML('afterend','<div class="key">'+r+'</div><p style="text-align:right"><button class="btn" id="nx">Seguir ›</button></p>');$('#nx').onclick=next}},1400)}
    else{b.classList.add('bad');if(wrong())return;m.className='msg bad';m.textContent='Todavía no. Probá otra vez.'}
   });
  };show();
 }else if(s.t==='order'){
  let q=0;
  const show=()=>{
   const w=s.items[q],sh=[...w].sort(()=>Math.random()-.5);let cur=[];
   st.innerHTML=`<div class="scene"><div class="paper"><h2>${s.title}</h2><p>${s.intro} (${q+1}/${s.items.length})</p><div class="row" id="bld" style="min-height:52px;border-bottom:2px dashed #7a5a30"></div><div class="row" id="pool"></div><p class="msg" id="m"></p><button class="btn" id="ck">Comprobar</button> <button class="btn" id="rs">Borrar</button></div></div>`;
   const draw=()=>{$('#bld').innerHTML=cur.map(n=>`<span class="chip">${sh[n]}</span>`).join('');
    $('#pool').innerHTML=sh.map((x,n)=>cur.includes(n)?'':`<button class="chip" data-n="${n}">${x}</button>`).join('');
    document.querySelectorAll('#pool .chip').forEach(b=>b.onclick=()=>{cur.push(+b.dataset.n);draw()})};
   draw();$('#rs').onclick=()=>{cur=[];draw()};
   $('#ck').onclick=()=>{const m=$('#m');
    if(cur.map(n=>sh[n]).join(' ')===w.join(' ')){sfx(1);q++;if(q<s.items.length)show();else{$('#ck').outerHTML='<div class="key">'+reward(s)+'</div><p><button class="btn" id="nx">Seguir ›</button></p>';$('#rs').remove();m.textContent='';$('#nx').onclick=next}}
    else{if(wrong())return;m.className='msg bad';m.textContent='No está bien ordenada. Probá otra vez.'}};
  };show();
 }else if(s.t==='code'){
  st.innerHTML=`<div class="scene"><div class="box center"><div class="who">El candado del vestuario</div><div class="txt">Escribí los tres números en orden.</div><p><input id="code" maxlength="3" inputmode="numeric" aria-label="Código de tres números"> <button class="btn" id="ck">Abrir</button></p><p class="msg" id="m"></p><p class="hint">Pista: mirá las llaves 🔑 de arriba.</p></div></div>`;
  $('#ck').onclick=()=>{if($('#code').value.trim()===KEYS.join(''))next();else{$('#m').className='msg bad';$('#m').textContent='El candado no se abre. Probá de nuevo.'}};
 }else if(s.t==='end'){
  st.innerHTML=`<div class="scene"><div class="avatar" aria-hidden="true">🧑‍🦱</div><div class="box"><div class="who">Tomi</div><div class="txt">¡Luna! Perdoname, me asusté. Entrené demasiado y ahora me duele todo: me duelen las piernas, me duele la espalda y hasta me duelen las manos. Mañana vamos juntos al médico, ¿dale?</div><div class="key">🏆 ¡Misión cumplida! Tomi está a salvo.<br>⭐ ${stars}/5 · 🔑 3/3 · XP ${xp} · ❤️ ${Math.max(lives,0)}</div><p style="text-align:right"><button class="btn" id="re">Jugar de nuevo</button></p></div></div>`;
  $('#re').onclick=()=>{i=0;got=[];lives=3;stars=0;xp=0;render()};
 }
}
render();
</script>
</body>
</html>
